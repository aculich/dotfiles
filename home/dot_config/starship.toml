# ~/.config/starship.toml  (common layer)
# Short two-line prompt. Modules only render when relevant, so it is quiet by
# default and shows git / language / container state when you are inside one.

add_newline = false
command_timeout = 500

format = """
$directory$git_branch$git_status$python$nodejs$rust$golang$docker_context$cmd_duration
$character"""

[directory]
truncation_length = 3
truncate_to_repo = true

[git_branch]
format = "[$symbol$branch]($style) "
symbol = ""

[git_status]
format = "([$all_status$ahead_behind]($style) )"

[python]
format = "[${symbol}${version}( \\($virtualenv\\))]($style) "
symbol = "py "

[nodejs]
format = "[$symbol($version )]($style)"
symbol = "node "

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
